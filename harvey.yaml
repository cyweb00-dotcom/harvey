persona:
  name: "Harvey"
  company: "CYWEB"
  role: "Business Development"
  email: "cyweb00@gmail.com"     # change to the mailbox Harvey actually sends from
  linkedin: ""
  tone: "professional, courteous and polished; clear and concise, never pushy or salesy"

product:
  name: "CYWEB Websites"
  description: >-
    CYWEB builds modern, professional websites for small and medium local
    businesses in Cyprus: restaurants, tavernas, cafés, barbershops, hair and
    beauty salons, clinics, bakeries, shops and hospitality. We build the
    website first and show the owner a free, no-obligation preview made for
    their business; they only pay if they like it. After that, one yearly plan
    covers the domain, hosting, updates and bug fixes. Online-only business,
    serving Limassol, Nicosia, Larnaca, Paphos and Ayia Napa.
  pricing: >-
    One-time build, then a yearly plan (domain + hosting + updates + bug fixes):
    Landing Page (up to 2 pages) €300 then €100/yr; Starter Website (up to 4
    pages) €400 then €100/yr; Business Website (up to 6 pages, most popular)
    €500 then €100/yr; Complete Website (7–9 pages) €600 then €150/yr; Premium
    Website (10+ pages) €1000 then €200/yr.
  key_benefits:
    - "See it before you pay: we build a free preview of your website first, no obligation"
    - "Professional quality from €300, instead of the thousands agencies usually charge"
    - "One simple yearly plan covers domain, hosting, updates and bug fixes, with no surprise costs"
    - "Works on mobile, tablet and desktop, with online booking, contact form, menu or prices, and SEO foundations"
    - "Helps customers find you on Google instead of only on Wolt, Foody or Facebook"
  objection_responses:
    "too expensive": "Understandable. The Landing Page is €300 once, then €100 a year, and that yearly plan already includes the domain, hosting and updates. Happy to show you a free preview first so you can judge if it's worth it."
    "already have a website": "Good to hear. We only build new sites, we don't edit other people's, so if yours is working for you, no problem. If it's outdated, I'm happy to show you a fresh preview to compare, no obligation."
    "facebook / instagram is enough": "Social pages are great for regulars, but people searching on Google for a place nearby land on websites and Maps first. A simple site with your menu, hours and booking catches those people."
    "not interested": "No problem at all, thanks for letting me know. I won't follow up again."
    "no time": "That's the point of how we work: we build it first and send you a preview link. It takes a couple of minutes of your time to look at it."
    "hidden costs": "None. The build is paid once, and the yearly plan covers domain, hosting, updates and bug fixes. If you ever stop the plan, the site stays up until the end of the paid year."
  offer:
    primary: "A professional website built by CYWEB, from €300 one-time plus a yearly plan from €100"
    entry: "A free, no-obligation preview of a website made for their business. They only pay if they like it."
    goal: "get_reply"                 # ask if they'd like to see the free preview
    booking_method: "ask_preference"
    booking_url: "https://cywebdev.com"
    meeting_duration: "15 minutes"
    meeting_owner: "the CYWEB founder, on Google Meet or Zoom"

icp:
  industries:
    - "Restaurants"
    - "Cafes"
    - "Barbershops"
    - "Hair salons"
    - "Beauty salons"
    - "Bakeries"
    - "Dentists"
    - "Clinics"
  company_size: "1-50 employees (owner-run local businesses)"
  titles:
    - "Owner"
    - "Co-owner"
    - "Manager"
    - "General Manager"
  geography:
    - "Limassol, Cyprus"
    - "Nicosia, Cyprus"
    - "Larnaca, Cyprus"
    - "Paphos, Cyprus"
    - "Ayia Napa, Cyprus"
  hiring_signals: []
  # lat,lng,radius_km. Nicosia is centred south of the Green Line and kept
  # small so results stay in the Republic of Cyprus side of the city.
  geo_coordinates:
    "Limassol, Cyprus": "34.6890,33.0400,10"
    "Nicosia, Cyprus": "35.1500,33.3650,6"
    "Larnaca, Cyprus": "34.9200,33.6230,8"
    "Paphos, Cyprus": "34.7720,32.4300,10"
    "Ayia Napa, Cyprus": "34.9950,34.0100,10"

channels:
  email:
    enabled: true
    provider: "gmail"
    max_daily_sends: 20             # start low; raise once replies look healthy
    require_approval: true          # every email waits for your OK in the Outbox
    send_to_risky: false
    max_bounce_rate: 0.05
  linkedin:
    enabled: false                  # local Cyprus owners are rarely on LinkedIn

usage:
  max_daily_claude_percent: 60      # leaves room for your own Claude work
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "21:00"
    end: "08:00"
    timezone: "Asia/Nicosia"

compliance:
  precleared:
    enabled: false                  # only supports GB/US senders
